[package]
name        = "swe_justoci_bench"
version     = "0.1.0"
edition     = "2021"
description = "SEA-layered Criterion benchmarks: build / sign / push / pipeline, just* vs oras+cosign."
license        = "Apache-2.0"
repository     = "https://github.com/sweengineeringlabs/justoci"
authors        = ["SWE Engineering Labs"]
# Intentionally not inheriting workspace MSRV: just-sign depends on
# swe_justsign_sign which requires 1.88; workspace MSRV is 1.86.
# This crate is dev tooling and is never published.

[features]
default       = []
just-build    = ["dep:oci-build", "dep:spec", "dep:tempfile"]
just-sign     = ["dep:swe_justsign_sign", "dep:p256", "dep:rand_chacha", "dep:rand_core"]
just-push     = ["dep:oci-build", "dep:oci-publish", "dep:spec", "dep:tempfile"]
just-pipeline = ["just-build", "just-sign", "just-push"]
oras          = ["dep:tempfile"]
cosign        = ["dep:tempfile"]

[dependencies]
serde             = { version = "1", features = ["derive"] }
toml              = "0.8"
oci-build         = { workspace = true, optional = true }
oci-publish       = { workspace = true, optional = true }
spec              = { workspace = true, optional = true }
swe_justsign_sign = { workspace = true, optional = true }
p256              = { version = "0.13", default-features = false, features = ["std", "ecdsa"], optional = true }
rand_chacha       = { version = "0.3",  default-features = false, optional = true }
rand_core         = { version = "0.6",  default-features = false, optional = true }
tempfile          = { version = "3", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "build"
harness = false

[[bench]]
name    = "sign"
harness = false

[[bench]]
name    = "push"
harness = false

[[bench]]
name    = "pipeline"
harness = false

[lints.rust]
unsafe_code = "forbid"
