# Benchmark cases for the justoci workspace.
#
# Add entries here to bench additional runners or payload sizes.
# `runner` must match a compiled-in feature flag (e.g. "justoci").
# All fields beyond `runner` and `label` are forwarded as params to
# the runner — see each runner's source for required keys.

# ── justoci (in-process, pure Rust) ─────────────────────────────────────────

[[case]]
runner        = "justoci"
label         = "justoci/4kb"
payload_bytes = 4096

[[case]]
runner        = "justoci"
label         = "justoci/1mb"
payload_bytes = 1048576

[[case]]
runner        = "justoci"
label         = "justoci/16mb"
payload_bytes = 16777216

# ── publish (in-process, HTTP push to local registry) ───────────────────────
# Requires: docker run -d -p 5000:5000 registry:2
# Run: cargo bench -p swe_justoci_bench --bench build --features publish
#
# Blobs are content-addressed; after the first Criterion warmup iteration the
# registry already holds every blob and subsequent iterations pay only
# HEAD×N + manifest PUT (the steady-state "re-push same image" path).

[[case]]
runner        = "publish"
label         = "publish/4kb"
payload_bytes = 4096
registry      = "localhost:5000"

[[case]]
runner        = "publish"
label         = "publish/1mb"
payload_bytes = 1048576
registry      = "localhost:5000"

[[case]]
runner        = "publish"
label         = "publish/16mb"
payload_bytes = 16777216
registry      = "localhost:5000"

# ── oras (subprocess, HTTP push to local registry) ───────────────────────────
# Requires: oras 1.x on PATH + a local registry:
#   docker run -d -p 5000:5000 registry:2
# Run: cargo bench -p swe_justoci_bench --bench build --features oras

[[case]]
runner        = "oras"
label         = "oras/4kb"
payload_bytes = 4096
registry      = "localhost:5000"

[[case]]
runner        = "oras"
label         = "oras/1mb"
payload_bytes = 1048576
registry      = "localhost:5000"

[[case]]
runner        = "oras"
label         = "oras/16mb"
payload_bytes = 16777216
registry      = "localhost:5000"
