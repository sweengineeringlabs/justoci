# Benchmark cases for the justoci pipeline.
#
# Each [[case]] declares:
#   bench  = operation scope: "build" | "push" | "pipeline"
#   runner = implementation:  "just-build" | "just-push" | "just-pipeline"
#                             | "oras" | "oras-cosign"
#   label  = unique human-readable identifier
# Remaining fields are forwarded as params to the runner.
#
# Sign-only comparison (just-sign vs cosign) lives in justsign/bench/.

# ── build: just-build (oci_build, in-process) ────────────────────────────────
# Run: cargo bench -p swe_justoci_bench --bench build --features just-build

[[case]]
bench         = "build"
runner        = "just-build"
label         = "just/4kb"
payload_bytes = 4096

[[case]]
bench         = "build"
runner        = "just-build"
label         = "just/1mb"
payload_bytes = 1048576

[[case]]
bench         = "build"
runner        = "just-build"
label         = "just/16mb"
payload_bytes = 16777216

# ── push: just-push (oci_publish, in-process HTTP) ──────────────────────────
# Requires: docker run -d -p 5000:5000 registry:2
# Run: OCIMAGE_ALLOW_INSECURE=1 cargo bench -p swe_justoci_bench --bench push --features just-push,oras

[[case]]
bench         = "push"
runner        = "just-push"
label         = "just/4kb"
payload_bytes = 4096
registry      = "localhost:5000"

[[case]]
bench         = "push"
runner        = "just-push"
label         = "just/1mb"
payload_bytes = 1048576
registry      = "localhost:5000"

[[case]]
bench         = "push"
runner        = "just-push"
label         = "just/16mb"
payload_bytes = 16777216
registry      = "localhost:5000"

[[case]]
bench         = "push"
runner        = "oras"
label         = "oras/4kb"
payload_bytes = 4096
registry      = "localhost:5000"

[[case]]
bench         = "push"
runner        = "oras"
label         = "oras/1mb"
payload_bytes = 1048576
registry      = "localhost:5000"

[[case]]
bench         = "push"
runner        = "oras"
label         = "oras/16mb"
payload_bytes = 16777216
registry      = "localhost:5000"

# ── pipeline: just-pipeline (build + sign + push, in-process) ───────────────
# Requires: docker run -d -p 5000:5000 registry:2
# Run: OCIMAGE_ALLOW_INSECURE=1 cargo bench -p swe_justoci_bench --bench pipeline --features just-pipeline,oras,cosign

[[case]]
bench         = "pipeline"
runner        = "just-pipeline"
label         = "just/4kb"
payload_bytes = 4096
registry      = "localhost:5000"

[[case]]
bench         = "pipeline"
runner        = "just-pipeline"
label         = "just/1mb"
payload_bytes = 1048576
registry      = "localhost:5000"

[[case]]
bench         = "pipeline"
runner        = "just-pipeline"
label         = "just/16mb"
payload_bytes = 16777216
registry      = "localhost:5000"

[[case]]
bench         = "pipeline"
runner        = "oras-cosign"
label         = "oras-cosign/4kb"
payload_bytes = 4096
registry      = "localhost:5000"

[[case]]
bench         = "pipeline"
runner        = "oras-cosign"
label         = "oras-cosign/1mb"
payload_bytes = 1048576
registry      = "localhost:5000"

[[case]]
bench         = "pipeline"
runner        = "oras-cosign"
label         = "oras-cosign/16mb"
payload_bytes = 16777216
registry      = "localhost:5000"
