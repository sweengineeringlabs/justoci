name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Warnings are signal — CI fails on any warning so the
  # "no #[allow] dances" rule the workspace lives by stays
  # enforceable across PRs.
  RUSTFLAGS: -D warnings

# justoci's Cargo.toml has a path-dep on the sibling justcas repo:
#   cas = { path = "../justcas/cas", package = "swe_justcas_cas" }
#
# CI must check both repos out as siblings before any cargo
# command runs. The default actions/checkout drops the repo into
# `$GITHUB_WORKSPACE`; we override `path:` to put justoci into
# `justoci/` and justcas into `justcas/` under the workspace, then
# run all cargo commands from `justoci/`.
#
# The justcas checkout requires a Personal Access Token (PAT) with
# `repo` scope stored as the `JUSTCAS_PAT` secret on the justoci
# repo, because justcas is private. (Default GITHUB_TOKEN is scoped
# to the running repo only.)

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout justoci
        uses: actions/checkout@v4
        with:
          path: justoci

      - name: Checkout justcas (sibling)
        uses: actions/checkout@v4
        with:
          repository: sweengineeringlabs/justcas
          path: justcas
          token: ${{ secrets.JUSTCAS_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: justoci -> justoci/target

      - name: Install cosign
        # Required for the attest crate's PATH-probe test
        # (`test_cosign_not_installed_when_path_lacks_binary` runs
        # ignored-by-default; we run it here with cosign present
        # to confirm the production happy path actually finds it).
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.0

      - name: cosign --version
        run: cosign version
        working-directory: justoci

      - name: cargo check
        run: cargo check --workspace --all-targets
        working-directory: justoci

      - name: cargo test
        run: cargo test --workspace
        working-directory: justoci

      - name: cargo test (cosign-installed PATH probe)
        # The attest crate marks one test #[ignore] because it
        # mutates PATH and must run with --test-threads=1. With
        # cosign actually installed in CI, run it explicitly so
        # the production cosign-on-PATH detection is exercised.
        run: cargo test --workspace -- --ignored --test-threads=1
        working-directory: justoci

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout justoci
        uses: actions/checkout@v4
        with:
          path: justoci

      - name: Checkout justcas (sibling)
        uses: actions/checkout@v4
        with:
          repository: sweengineeringlabs/justcas
          path: justcas
          token: ${{ secrets.JUSTCAS_PAT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: justoci -> justoci/target

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: justoci

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  smoke:
    # Real-registry smoke test — runs the cargo test gated with
    # `#[ignore]`, which spawns a `registry:2` container, drives
    # `ocimage build → publish → verify` against it, and asserts
    # the OCI Distribution v2 wire shape the httpmock-based tests
    # in `test` cannot catch (upload-session UUIDs, real HEAD-then-
    # PUT statefulness across re-publishes, manifest media-type
    # negotiation, byte-equality of the round-trip).
    #
    # Requires Docker available on the runner; `ubuntu-latest`
    # ships with Docker out of the box. The test itself prints a
    # SKIP line and returns Ok if `docker info` fails, but on this
    # runner the daemon is always present — a SKIP here would
    # indicate the runner image regressed.
    name: smoke (real registry:2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout justoci
        uses: actions/checkout@v4
        with:
          path: justoci

      - name: Checkout justcas (sibling)
        uses: actions/checkout@v4
        with:
          repository: sweengineeringlabs/justcas
          path: justcas
          token: ${{ secrets.JUSTCAS_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: justoci -> justoci/target

      - name: Pre-pull registry image
        # Speeds up the test (avoids docker-pull inside the test
        # path) and isolates docker-hub rate-limit issues here
        # rather than making them look like test failures.
        run: docker pull registry:2

      - name: Run smoke test
        run: cargo test -p swe_justoci_oci_cli --test registry_smoke_test -- --ignored --test-threads=1
        working-directory: justoci

  msrv:
    # Verifies the workspace still compiles on the MSRV declared in
    # the root Cargo.toml's `[workspace.package]` block. Runs `cargo
    # check` (not `cargo test`) — the contract is "the production
    # source builds on MSRV", not "test deps build on MSRV". Test
    # deps (httpmock, assert_cmd, etc.) are free to require newer
    # toolchains; CI's `test` job covers that on stable.
    #
    # If you bump the workspace MSRV, update the toolchain version
    # below to match. Keeping the two in sync is the whole point of
    # this job.
    name: cargo check (MSRV 1.86)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout justoci
        uses: actions/checkout@v4
        with:
          path: justoci

      - name: Checkout justcas (sibling)
        uses: actions/checkout@v4
        with:
          repository: sweengineeringlabs/justcas
          path: justcas
          token: ${{ secrets.JUSTCAS_PAT }}

      - uses: dtolnay/rust-toolchain@1.86.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: justoci -> justoci/target

      - name: cargo check
        run: cargo check --workspace --all-targets
        working-directory: justoci
