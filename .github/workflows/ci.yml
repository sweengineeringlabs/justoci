name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Warnings are signal — CI fails on any warning so the
  # "no #[allow] dances" rule the workspace lives by stays
  # enforceable across PRs.
  RUSTFLAGS: -D warnings

# justoci's Cargo.toml has a path-dep on the sibling justcas repo:
#   cas = { path = "../justcas/cas", package = "swe_justcas_cas" }
#
# CI must check both repos out as siblings before any cargo
# command runs. The default actions/checkout drops the repo into
# `$GITHUB_WORKSPACE`; we override `path:` to put justoci into
# `justoci/` and justcas into `justcas/` under the workspace, then
# run all cargo commands from `justoci/`.
#
# The justcas checkout requires a Personal Access Token (PAT) with
# `repo` scope stored as the `JUSTCAS_PAT` secret on the justoci
# repo, because justcas is private. (Default GITHUB_TOKEN is scoped
# to the running repo only.)

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout justoci
        uses: actions/checkout@v4
        with:
          path: justoci

      - name: Checkout justcas (sibling)
        uses: actions/checkout@v4
        with:
          repository: sweengineeringlabs/justcas
          path: justcas
          token: ${{ secrets.JUSTCAS_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: justoci -> justoci/target

      - name: Install cosign
        # Required for the attest crate's `cosign-subprocess`
        # fallback PATH-probe test (gated #[ignore]; only meaningful
        # when the fallback feature is on AND cosign is installed).
        # Default builds run sigstore-rs and don't need cosign on
        # PATH, but the fallback-feature CI job below does.
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.0

      - name: cosign --version
        run: cosign version
        working-directory: justoci

      - name: cargo check
        run: cargo check --workspace --all-targets
        working-directory: justoci

      - name: cargo test (default features — sigstore-rs production path)
        run: cargo test --workspace
        working-directory: justoci

  test-cosign-subprocess-fallback:
    # Verifies the legacy cosign-subprocess fallback still
    # compiles and tests under the opt-in feature combo. Issue
    # #13 swapped the default production signer to sigstore-rs;
    # the cosign subprocess path is kept behind
    # `--features cosign-subprocess` for environments where the
    # SDK dep tree is unwelcome. We run the attest crate's tests
    # in both feature configurations to prove the trait surface
    # (CosignInvoker / CosignOutcome) is bit-for-bit
    # behaviour-preserving across the two implementations.
    name: cargo test (cosign-subprocess fallback)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout justoci
        uses: actions/checkout@v4
        with:
          path: justoci

      - name: Checkout justcas (sibling)
        uses: actions/checkout@v4
        with:
          repository: sweengineeringlabs/justcas
          path: justcas
          token: ${{ secrets.JUSTCAS_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: justoci -> justoci/target

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.0

      - name: cargo check (cosign-subprocess only)
        run: cargo check -p swe_justoci_attest --no-default-features --features cosign-subprocess --all-targets
        working-directory: justoci

      - name: cargo test (cosign-subprocess only)
        run: cargo test -p swe_justoci_attest --no-default-features --features cosign-subprocess
        working-directory: justoci

      - name: cargo test (cosign-installed PATH probe under fallback)
        # The PATH-probe `#[ignore]` test only exists under the
        # cosign-subprocess feature. Run it explicitly with cosign
        # installed so the production cosign-on-PATH detection
        # is exercised.
        run: cargo test -p swe_justoci_attest --no-default-features --features cosign-subprocess -- --ignored --test-threads=1
        working-directory: justoci

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout justoci
        uses: actions/checkout@v4
        with:
          path: justoci

      - name: Checkout justcas (sibling)
        uses: actions/checkout@v4
        with:
          repository: sweengineeringlabs/justcas
          path: justcas
          token: ${{ secrets.JUSTCAS_PAT }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: justoci -> justoci/target

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: justoci

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  smoke:
    # Real-registry smoke test — runs the cargo test gated with
    # `#[ignore]`, which spawns a `registry:2` container, drives
    # `ocimage build → publish → verify` against it, and asserts
    # the OCI Distribution v2 wire shape the httpmock-based tests
    # in `test` cannot catch (upload-session UUIDs, real HEAD-then-
    # PUT statefulness across re-publishes, manifest media-type
    # negotiation, byte-equality of the round-trip).
    #
    # Requires Docker available on the runner; `ubuntu-latest`
    # ships with Docker out of the box. The test itself prints a
    # SKIP line and returns Ok if `docker info` fails, but on this
    # runner the daemon is always present — a SKIP here would
    # indicate the runner image regressed.
    name: smoke (real registry:2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout justoci
        uses: actions/checkout@v4
        with:
          path: justoci

      - name: Checkout justcas (sibling)
        uses: actions/checkout@v4
        with:
          repository: sweengineeringlabs/justcas
          path: justcas
          token: ${{ secrets.JUSTCAS_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: justoci -> justoci/target

      - name: Pre-pull registry image
        # Speeds up the test (avoids docker-pull inside the test
        # path) and isolates docker-hub rate-limit issues here
        # rather than making them look like test failures.
        run: docker pull registry:2

      - name: Run smoke test
        run: cargo test -p swe_justoci_oci_cli --test registry_smoke_test -- --ignored --test-threads=1
        working-directory: justoci

  jcs-cross-lang:
    # Cross-language JCS canonicalisation verification.
    #
    # The fixture set under `tests/fixtures/jcs/` ships the JCS
    # canonical bytes + spec hash for a representative set of specs
    # (anchor, unicode, numeric edge cases, deeply nested key
    # ordering, full vm_image). This job:
    #
    #   1. Re-runs the regenerate-jcs-fixtures binary with --check
    #      to catch any contributor who edited a fixture's spec.toml
    #      but forgot to refresh the committed expected.* files.
    #   2. Builds and runs the Go-side verifier, which re-implements
    #      the spec_to_json projection in Go and feeds the result to
    #      gowebpki/jcs. A mismatch means the Rust impl and a Go
    #      re-implementation disagree on the canonical form — the
    #      exact bug class Production Guarantee §3 forbids.
    #
    # Python verification is wired but not run in this job — Go is
    # the mandatory cross-language check; Python is an optional
    # belt-and-braces step contributors can run locally
    # (bash tests/fixtures/jcs/verify_python.sh).
    name: JCS cross-language verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout justoci
        uses: actions/checkout@v4
        with:
          path: justoci

      - name: Checkout justcas (sibling)
        uses: actions/checkout@v4
        with:
          repository: sweengineeringlabs/justcas
          path: justcas
          token: ${{ secrets.JUSTCAS_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: justoci -> justoci/target

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Verify fixtures match Rust impl (--check)
        run: cargo run -p swe_justoci_oci_cli --bin regenerate-jcs-fixtures -- --check
        working-directory: justoci

      - name: Verify cross-language JCS agreement (Go)
        run: bash tests/fixtures/jcs/verify_go.sh
        working-directory: justoci

  sigstore-e2e:
    # Real Fulcio + Rekor end-to-end against Sigstore staging
    # (`fulcio.sigstage.dev` / `rekor.sigstage.dev`). Issue #14.
    #
    # The job:
    #   1. Asks GitHub Actions to mint an OIDC identity token via
    #      `actions/github-script`. The token's audience claim MUST
    #      be "sigstore" — that is the value Fulcio (both production
    #      and staging) requires for keyless signing JWTs. Any other
    #      audience is rejected by Fulcio with a verifier error.
    #   2. Exports the token as `OIDC_TOKEN` (the env var the
    #      production `SigstoreInvoker` reads) for the test process.
    #   3. Runs the `#[ignore]`-gated `sigstore_e2e_test` with
    #      `--ignored --test-threads=1`. The serial-test pin is
    #      because Sigstore rate-limits per-identity; running tests
    #      in parallel would race the OIDC subject against itself.
    #
    # ## What this job exercises today (sigstore-rs 0.13)
    #
    # The current sigstore-rs SDK does not expose a public path to
    # construct a staging `SigningContext` — see the
    # `SigstoreInvoker::staging` docstring and the `STAGING_UNAVAIL-
    # ABLE_MSG` constant in `attest/src/core/sigstore_invoker.rs`.
    # Until upstream lands a `staging()` constructor, this job
    # exercises the production-hygiene assertion in the test:
    #   - the `staging()` invoker MUST return a Staging-targeted
    #     invoker (not Production), and
    #   - the invoker MUST surface the upstream-gap diagnostic, NOT
    #     fall back to production Sigstore (which would write CI
    #     test runs to the immutable public production Rekor log).
    # The test SKIP-passes after asserting both — see the
    # `SKIP[sigstore-e2e]` marker line in the job log.
    #
    # ## What this job will exercise after the upstream gap closes
    #
    # When sigstore-rs grows a public staging path and we lift the
    # gate in `SigstoreInvoker::staging`, this same job — without
    # YAML changes — will hit `fulcio.sigstage.dev` for a real
    # signing certificate, sign a fixture digest, write to
    # `rekor.sigstage.dev`, and validate the returned bundle.
    #
    # ## Permissions
    #
    # `id-token: write` is the GitHub Actions permission required
    # to call `core.getIDToken()`. `contents: read` is the
    # workspace-default; we list it explicitly because once you
    # set any `permissions:` key, all unset keys default to none.
    name: Sigstore staging e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout justoci
        uses: actions/checkout@v4
        with:
          path: justoci

      - name: Checkout justcas (sibling)
        uses: actions/checkout@v4
        with:
          repository: sweengineeringlabs/justcas
          path: justcas
          token: ${{ secrets.JUSTCAS_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: justoci -> justoci/target

      - name: Get OIDC token from GitHub Actions
        id: oidc
        uses: actions/github-script@v7
        with:
          # `aud=sigstore` is mandatory — Fulcio (staging and
          # production) rejects any other audience. Confirmed
          # against the Fulcio configuration response:
          #   https://fulcio.sigstage.dev/api/v2/configuration
          # which lists `"audience": "sigstore"` for the
          # token.actions.githubusercontent.com issuer.
          script: |
            const token = await core.getIDToken('sigstore');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Run sigstore staging e2e
        env:
          # Wire the OIDC token to the env var
          # `SigstoreInvoker::resolve_oidc_token` reads. The
          # `OIDC_TOKEN` name is the generic fallback in the
          # invoker's resolution order; if a future change adds
          # a sigstore-specific channel, switch this to
          # `SIGSTORE_ID_TOKEN` in lockstep.
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          cargo test -p swe_justoci_attest \
            --test sigstore_e2e_test \
            -- --ignored --test-threads=1
        working-directory: justoci

  msrv:
    # Verifies the workspace still compiles on the MSRV declared in
    # the root Cargo.toml's `[workspace.package]` block. Runs `cargo
    # check` (not `cargo test`) — the contract is "the production
    # source builds on MSRV", not "test deps build on MSRV". Test
    # deps (httpmock, assert_cmd, etc.) are free to require newer
    # toolchains; CI's `test` job covers that on stable.
    #
    # If you bump the workspace MSRV, update the toolchain version
    # below to match. Keeping the two in sync is the whole point of
    # this job.
    name: cargo check (MSRV 1.86)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout justoci
        uses: actions/checkout@v4
        with:
          path: justoci

      - name: Checkout justcas (sibling)
        uses: actions/checkout@v4
        with:
          repository: sweengineeringlabs/justcas
          path: justcas
          token: ${{ secrets.JUSTCAS_PAT }}

      - uses: dtolnay/rust-toolchain@1.86.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: justoci -> justoci/target

      - name: cargo check
        run: cargo check --workspace --all-targets
        working-directory: justoci
