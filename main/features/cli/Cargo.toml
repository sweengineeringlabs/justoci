[package]
name = "swe_justoci_oci_cli"
version = "0.1.0"
edition = "2021"
description = "justoci — operator-facing CLI for justoci. Subcommands: build, publish, verify, sbom, inspect."
license = "Apache-2.0"
repository = "https://github.com/sweengineeringlabs/justoci"
authors = ["SWE Engineering Labs"]
rust-version.workspace = true

[package.metadata.struct-engine]
application_type = "bin"

# Cargo features. The default binary stays lean — no Vault dep, no
# tokio runtime, no Docker-config reader — so the operator who never
# touches an opt-in `--auth ...` mode pays no binary-size or
# compile-time cost. Building with `--features vault` /
# `--features docker-config` opts the operator into the matching
# credential provider; see
# `cli/src/registry/credential_provider/{vault,docker_config}.rs`.
# Both features are additive — `--features "vault,docker-config"` is
# a supported combination and exercised in CI.
[features]
default       = []
vault         = ["dep:vaultrs", "dep:tokio"]
docker-config = ["dep:base64", "dep:dirs"]

# Library + binary. The library exposes the typed subcommand
# entry points, error mapping, verify pillar walker, and policy
# parser so integration tests in `tests/` can drive subcommand
# logic with stubbed cosign invokers without spawning the binary.
# The binary is a thin shim that maps clap → library calls →
# exit code; operators still invoke `justoci` by name.
[lib]
name = "swe_justoci_oci_cli"
path = "src/lib.rs"

[[bin]]
name = "oci"
path = "src/main.rs"

# Maintenance binary for the cross-language JCS fixture set under
# `tests/fixtures/jcs/`. NOT shipped to operators — invoked by
# contributors via `cargo run -p swe_justoci_oci_cli --bin
# regenerate-jcs-fixtures` whenever the spec projection rules
# legitimately change. CI's `jcs-cross-lang` job runs this with
# `--check` to fail loudly if a fixture drifts from the Rust impl.
[[bin]]
name = "regenerate-jcs-fixtures"
path = "src/bin/regenerate-jcs-fixtures.rs"

[dependencies]
# Internal crates the CLI dispatches into.
spec        = { workspace = true }
cas         = { workspace = true }
oci-build   = { workspace = true }
attest      = { workspace = true }
oci-publish = { workspace = true }

# External — only what the CLI itself needs.
clap               = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
toml               = { workspace = true }
thiserror          = { workspace = true }
sha2               = { workspace = true }
# Direct OCI Distribution v2 wire calls for `justoci verify
# <registry-ref>` — GET /v2/<repo>/manifests/<tag>, GET blobs,
# GET /v2/<repo>/referrers/<digest>. Same shape the publish crate
# uses for the push side; we don't share its module because the
# wire calls are GET-only and have a distinct error / streaming
# shape (download → hasher → tempdir blob path).
reqwest          = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
tempfile         = "3"

# ── Optional, gated behind the `vault` feature. ────────────────────────────
# `vaultrs` is the most-maintained Rust client for the HashiCorp Vault HTTP
# API; pinned to 0.7.4 (MIT-licensed, Apache-2.0-compatible). It's an
# async client built on `reqwest` + `tokio`, so when the feature is
# active we also pull in tokio to drive the Vault calls from the
# otherwise-blocking CLI. Without `--features vault`, neither dep is
# compiled — the default binary keeps its current shape.
vaultrs          = { version = "0.7", optional = true }
tokio            = { workspace = true, optional = true }

# ── Optional, gated behind the `docker-config` feature. ────────────────────
# `base64` 0.22 (MIT OR Apache-2.0) provides the v0.22 `Engine::decode`
# API used to decode the inline `auth` field of `~/.docker/config.json`
# back to `username:password` bytes. `dirs` 5 (MIT OR Apache-2.0)
# resolves the platform-specific home directory so we can locate
# `~/.docker/config.json` on Windows (`%USERPROFILE%\.docker`),
# Linux (`$HOME/.docker`), and macOS without a per-platform cfg block.
# Both crates are tiny (no transitive runtime / network deps) so the
# binary-size cost of opting into this feature is negligible.
base64           = { version = "0.22", optional = true }
dirs             = { version = "5", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = { workspace = true }
# httpmock fakes the OCI Distribution registry endpoint at the
# HTTP layer for `justoci verify <registry-ref>` integration tests.
# Same dep choice the publish crate uses; lets us assert the exact
# GET sequence the pull path emits.
httpmock         = "0.7"

[[test]]
name = "registry_pull_test"
path = "tests/registry_pull_test.rs"

# `vault` feature integration test. Compiled only when the feature
# is active — without it, vaultrs isn't in the dep graph and the
# integration test can't refer to the provider type. The single
# test inside is `#[ignore]`-gated and only runs when a Vault dev
# server is reachable on `VAULT_ADDR` + `VAULT_TOKEN`; CI without
# Vault produces no spurious failure.
[[test]]
name             = "vault_provider_test"
path             = "tests/vault_provider_test.rs"
required-features = ["vault"]

# `docker-config` feature integration test. Compiled only when the
# feature is active — without it, `base64` + `dirs` aren't in the dep
# graph and the integration test can't refer to the provider type.
# Unlike the Vault test, this one needs no external service: it
# stages a tempdir, writes a fake `config.json`, and points the
# provider at it. Runs as part of the default
# `cargo test -p swe_justoci_oci_cli --features docker-config` cycle.
[[test]]
name             = "docker_config_provider_test"
path             = "tests/docker_config_provider_test.rs"
required-features = ["docker-config"]
