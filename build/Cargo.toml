[package]
name = "swe_justoci_oci_build"
version = "0.1.0"
edition = "2021"
description = "oci-build — assemble an OCI Image Spec v1.1 layout from a justoci `Spec`. Deterministic layer/config/manifest blobs in a content-addressed store."
license = "MIT"
repository = "https://github.com/sweengineeringlabs/justoci"
authors = ["SWE Engineering Labs"]
rust-version = "1.86"

[package.metadata.struct-engine]
application_type = "lib"

[lib]
name = "oci_build"
path = "src/lib.rs"

[dependencies]
# Typed errors. `anyhow` deliberately omitted: the public surface of
# `BuildError` is a typed enum so callers can match on actionable
# variants instead of stringly-typed wrappers.
thiserror          = { workspace = true }
tracing            = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
# Justoci spec — the input contract for the build pipeline.
spec               = { workspace = true }
# Content-addressed storage. Every layer / config / manifest blob
# lands in a `Cas` so partial writes never become visible blobs and
# duplicate writes are deduplicated by content.
cas                = { workspace = true }
# Streaming sha256, paired with `cas` for blob digests we hand into
# the OCI manifest as descriptor digests.
sha2               = { workspace = true }
hex                = "0.4"
# Layer compression backends. Enabled per-layer based on the spec's
# `Compression` value — no implicit compression.
flate2             = "1"
zstd               = "0.13"
# Tar layer assembly. `LayerSource::Files` becomes a deterministic
# tar via this crate's manual `Header` API — sorted entries, mtime=0,
# uid:gid=0:0, mode from spec.
tar                = "0.4"
# Legacy types (`ImageSpec`, `BuildArtifacts`, `BuildManifest`) are
# kept as plain serde data so sibling crates (`oci-publish`, the
# `cli`) compile against the existing field shapes while their own
# refactors are pending. `toml` is used by the legacy `BuildManifest`
# JSON serialiser tests.
toml               = { workspace = true }

[dev-dependencies]
# Tempdir-backed integration tests stage source files alongside specs.
tempfile           = "3"

# Integration test surface. `vm_image_build_test` covers a 3-layer
# vm_image end-to-end; `reproducibility_test` is the
# Production-Guarantees-§2 gate; `oci_artifact_build_test` exercises
# the single-layer no-compression path; `tar_determinism_test`
# anchors the deterministic tar invariants; `compression_test` proves
# gzip / zstd produce different bytes than `none`; `atomicity_test`
# proves a failed build leaves a `.partial` dir and no final dir.
[[test]]
name = "vm_image_build_test"
path = "tests/vm_image_build_test.rs"

[[test]]
name = "reproducibility_test"
path = "tests/reproducibility_test.rs"

[[test]]
name = "oci_artifact_build_test"
path = "tests/oci_artifact_build_test.rs"

[[test]]
name = "tar_determinism_test"
path = "tests/tar_determinism_test.rs"

[[test]]
name = "compression_test"
path = "tests/compression_test.rs"

[[test]]
name = "atomicity_test"
path = "tests/atomicity_test.rs"
