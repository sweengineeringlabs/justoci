# alpine-minimal — the smallest viable ImageSpec.
#
# Boots Alpine Linux with xkvm-fs as PID 1 and drops to a shell on
# /dev/ttyS0. Useful as (a) a smoke-test target when verifying the
# end-to-end build→push→pull→boot pipeline, (b) the starter template
# someone copies when authoring a new image for their own app.

id          = "alpine-minimal:1.0"
description = "Bare Alpine 3.20 rootfs; xkvm-fs init drops to a shell."
init_mode   = "xkinit"
# kernel_cmdline omitted → default `console=ttyS0 rdinit=/init` applies.
node_tags   = ["linux", "x86_64"]

# Drop to a login shell. An empty entrypoint + `interactive = true`
# inside /etc/xkvm.conf (generated by the build) puts the tenant at
# a prompt.
entrypoint = []

[base]
kind = "local_rootfs"
path = "downloads/rootfs-alpine.ext4"

# Phase 2f-α: `packages` and `files` are carried in the schema but
# rejected by validation until the WSL-chroot-install path lands.
# When 2f-α+ ships, uncomment lines like:
# packages = []
# files = []

[env]
# PATH etc. come from /etc/profile in the base rootfs; nothing to
# add here for minimal.

[labels]
"org.opencontainers.image.authors"     = "ops@example.com"
"org.opencontainers.image.version"     = "1.0"
"org.opencontainers.image.description" = "Alpine 3.20 — xkvm minimal"
