# postgres-16 — Postgres 16 on Alpine 3.20.
#
# Reference template for a stateful managed-database image. Shape
# echoes the public clouds' pattern: PostgreSQL server pre-installed,
# configuration via env vars, persistent state on a tenant-supplied
# disk.
#
# Phase 2f-α LIMITATION: the `packages` field below is commented out
# because WSL-chroot apk-install isn't wired yet (2f-α+). In this
# phase the image boots the base rootfs unmodified — it's the SHAPE
# of a real Postgres template, not a functional one. To actually ship
# Postgres today, bake postgresql16 into the base rootfs offline
# (e.g., `apk add postgresql16` inside WSL before running bootstrap)
# and reference that prepared rootfs under `base.path`.

id          = "postgres:16"
description = "PostgreSQL 16 on Alpine 3.20. Stateful; persistent data lives on a tenant-supplied disk."
init_mode   = "xkinit"
node_tags   = ["linux", "x86_64", "postgres"]

# Entrypoint the init runs after mounts + env are set up. Tenant
# overrides nothing here; customisation happens via cloud-init
# user-data passed at CreateInstance (OOS-42).
entrypoint = [
    "/usr/bin/pg_ctl",
    "-D", "/var/lib/postgresql/data",
    "-l", "/var/log/postgresql.log",
    "start",
]

[base]
kind = "local_rootfs"
path = "downloads/rootfs-alpine.ext4"

# 2f-α+: uncomment once apk-install lands. When it does, delete the
# "prepare rootfs offline" workaround in the header comment above.
# packages = ["postgresql16", "postgresql16-contrib"]

[env]
# Non-secret defaults. Real credentials flow via Fleet's
# `CreateInstanceRequest.env` / `cloud_init_user_data` at instance-
# create time, not baked into the image.
POSTGRES_DB       = "app"
POSTGRES_USER     = "app"
PGDATA            = "/var/lib/postgresql/data"
LANG              = "en_US.utf8"

[labels]
"org.opencontainers.image.authors"     = "ops@example.com"
"org.opencontainers.image.source"      = "https://github.com/acme/xkvm-postgres"
"org.opencontainers.image.version"     = "16.2"
"org.opencontainers.image.licenses"    = "PostgreSQL"
"org.opencontainers.image.description" = "Postgres 16 on Alpine — xkvm image"
