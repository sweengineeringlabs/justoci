# redis-7 — Redis 7 on Alpine 3.20.
#
# Reference template for an in-memory managed-cache image. Distinct
# shape from postgres-16.toml: no persistent PGDATA volume, workload
# is memory-bound not disk-bound, entrypoint is the server binary
# directly (no wrapper init). Demonstrates how lighter apps look in
# the same ImageSpec schema.
#
# Same Phase 2f-α limitation as postgres-16.toml: the `packages`
# field is commented out pending the chroot-install wiring. In this
# phase, prepare the rootfs offline or reference a pre-baked base.

id          = "redis:7"
description = "Redis 7 on Alpine 3.20. In-memory; configure via env + cloud-init."
init_mode   = "xkinit"
node_tags   = ["linux", "x86_64"]

entrypoint = [
    "/usr/bin/redis-server",
    "--protected-mode", "no",     # xkvm's virtio-net already bounds
                                  # the blast radius; host firewall
                                  # is the real perimeter.
    "--bind",          "0.0.0.0",
    "--maxmemory",     "${REDIS_MAXMEMORY}",
    "--maxmemory-policy", "allkeys-lru",
]

[base]
kind = "local_rootfs"
path = "downloads/rootfs-alpine.ext4"

# 2f-α+: uncomment once apk-install lands.
# packages = ["redis"]

[env]
# Safe defaults. Tenants override REDIS_PASSWORD via
# CreateInstance.env; unset = no auth (suitable for the xkvm
# single-tenant per-VM isolation model).
REDIS_MAXMEMORY = "256mb"

[labels]
"org.opencontainers.image.authors"     = "ops@example.com"
"org.opencontainers.image.source"      = "https://github.com/acme/xkvm-redis"
"org.opencontainers.image.version"     = "7.2"
"org.opencontainers.image.licenses"    = "RSALv2"
"org.opencontainers.image.description" = "Redis 7 on Alpine — xkvm image"
