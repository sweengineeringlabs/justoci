# End-to-end benchmark cases.
#
# Each case runs the full artifact pipeline end-to-end:
#   rust-pipeline : oci_build::build + sign_blob + oci_publish::publish
#   oras-cosign   : oras push + cosign sign-blob (subprocesses)
#
# Prerequisites:
#   docker run -d -p 5000:5000 registry:2
#   oras 1.x on PATH
#   cosign 2.x+ on PATH  (Linux / WSL2)
#
# Run:
#   OCIMAGE_ALLOW_INSECURE=1 cargo bench -p swe_justoci_e2e_bench --bench pipeline
#   OCIMAGE_ALLOW_INSECURE=1 cargo bench -p swe_justoci_e2e_bench --bench pipeline --features oras-cosign

# ── Rust pipeline (in-process: build + sign + push) ──────────────────────────

[[case]]
runner        = "rust-pipeline"
label         = "rust/4kb"
payload_bytes = 4096
registry      = "localhost:5000"

[[case]]
runner        = "rust-pipeline"
label         = "rust/1mb"
payload_bytes = 1048576
registry      = "localhost:5000"

[[case]]
runner        = "rust-pipeline"
label         = "rust/16mb"
payload_bytes = 16777216
registry      = "localhost:5000"

# ── oras + cosign (subprocess: oras push + cosign sign-blob) ─────────────────

[[case]]
runner        = "oras-cosign"
label         = "oras-cosign/4kb"
payload_bytes = 4096
registry      = "localhost:5000"

[[case]]
runner        = "oras-cosign"
label         = "oras-cosign/1mb"
payload_bytes = 1048576
registry      = "localhost:5000"

[[case]]
runner        = "oras-cosign"
label         = "oras-cosign/16mb"
payload_bytes = 16777216
registry      = "localhost:5000"
