[workspace]
resolver = "2"
members = [
    "main/features/spec",
    "main/features/attest",
    "main/features/build",
    "main/features/publish",
    "main/features/cli",
    "bench",
]

# Single source of truth for MSRV across the workspace. Each crate's
# `[package]` section uses `rust-version.workspace = true` so updates
# happen once here, not in six places. Pinned to 1.86 because the
# active dep graph already requires it: `reqwest -> url -> idna ->
# icu_collections` declares `rust-version = "1.86"` (icu_collections
# 2.x family), and `clap_builder` requires 1.85. Going lower than 1.86
# is not achievable today without dropping `reqwest` (used by
# `oci-publish` and `cli`) or downgrading `idna`/`icu_*`. CI verifies
# the pin holds with a `cargo check` job pinned to this toolchain.
[workspace.package]
rust-version = "1.86"

[workspace.dependencies]
# ── Internal sibling crates ────────────────────────────────────────────────
spec        = { path = "main/features/spec",    package = "swe_justoci_spec" }
attest      = { path = "main/features/attest",  package = "swe_justoci_attest" }
oci-build   = { path = "main/features/build",   package = "swe_justoci_oci_build" }
oci-publish = { path = "main/features/publish", package = "swe_justoci_oci_publish" }

# ── Cross-repo sibling — swelabs/virtualization/justcas ──────────────────
# Content-addressed storage primitive. Used by `spec` for the canonical
# spec hash, and by every later crate (build, attest, publish) for layer
# blobs, manifest digests, attestation referrers.
cas = { git = "ssh://git@github.com/sweengineeringlabs/justcas.git", tag = "v0.1.0", package = "swe_justcas_cas" }

# ── Cross-repo sibling — swelabs/virtualization/justsign ──────────────────
# Used ONLY when `attest` is built with `--features justsign` (the
# third `CosignInvoker` impl alongside `sigstore-rs` and
# `cosign-subprocess`). The path walks one level up out of
# justoci-worktrees/justsign-invoker/ — i.e. the same parent the other
# cross-repo siblings sit under (justcas/, justobserv/, vmisolate/) —
# and lands in the justsign sibling repo's per-crate workspace
# members. The four crates compose into the justsign-backed signing
# surface justsign issue #16 wires up:
#
# * `swe_justsign_sign`   — `sign_blob_keyless()` + `EcdsaP256Signer`
#   (the operation the invoker drives).
# * `swe_justsign_fulcio` — `HttpFulcioClient` + `build_csr()`
#   (CSR + OIDC-token → cert chain).
# * `swe_justsign_rekor`  — `HttpRekorClient` (transparency-log
#   submit; Rekor coupling enforced inside `sign_blob_keyless`).
# * `swe_justsign_spec`   — `Bundle::encode_json()`
#   (canonicalised JSON the invoker hands back as `bundle_bytes`).
#
# Under the default `sigstore-rs` feature these path-deps are silently
# dropped — no `version` is declared next to `path`, matching the
# convention the other cross-workspace path-deps in this block follow.
swe_justsign_sign   = { path = "../justsign/sign",   package = "swe_justsign_sign"   }
swe_justsign_fulcio = { path = "../justsign/fulcio", package = "swe_justsign_fulcio" }
swe_justsign_rekor  = { path = "../justsign/rekor",  package = "swe_justsign_rekor"  }
swe_justsign_spec   = { path = "../justsign/spec",   package = "swe_justsign_spec"   }

# ── External ──────────────────────────────────────────────────────────────
thiserror          = "2"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "0.8"
clap               = { version = "4", features = ["derive", "env"] }
tokio              = { version = "1", features = ["full"] }
sha2               = "0.10"
oci-distribution   = { version = "0.11", default-features = false, features = ["rustls-tls"] }
# RFC 8785 JSON Canonicalization Scheme. Used by `spec::saf::canonicalize`
# to compute the spec hash. Language-agnostic standard so re-implementations
# of justoci in Go/Python compute the same hash for the same TOML input.
serde_jcs          = "0.1"
