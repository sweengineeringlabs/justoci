[package]
name = "swe_justoci_oci_cli"
version = "0.1.0"
edition = "2021"
description = "ocimage — operator-facing CLI for justoci. Subcommands: build, publish, verify, sbom, inspect."
license = "MIT"
repository = "https://github.com/sweengineeringlabs/justoci"
authors = ["SWE Engineering Labs"]
rust-version = "1.86"

[package.metadata.struct-engine]
application_type = "bin"

# Library + binary. The library exposes the typed subcommand
# entry points, error mapping, verify pillar walker, and policy
# parser so integration tests in `tests/` can drive subcommand
# logic with stubbed cosign invokers without spawning the binary.
# The binary is a thin shim that maps clap → library calls →
# exit code; operators still invoke `ocimage` by name.
[lib]
name = "swe_justoci_oci_cli"
path = "src/lib.rs"

[[bin]]
name = "ocimage"
path = "src/main.rs"

[dependencies]
# Internal crates the CLI dispatches into.
spec        = { workspace = true }
cas         = { workspace = true }
oci-build   = { workspace = true }
attest      = { workspace = true }
oci-publish = { workspace = true }

# External — only what the CLI itself needs.
clap               = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
toml               = { workspace = true }
thiserror          = { workspace = true }
sha2               = { workspace = true }
# Direct OCI Distribution v2 wire calls for `ocimage verify
# <registry-ref>` — GET /v2/<repo>/manifests/<tag>, GET blobs,
# GET /v2/<repo>/referrers/<digest>. Same shape the publish crate
# uses for the push side; we don't share its module because the
# wire calls are GET-only and have a distinct error / streaming
# shape (download → hasher → tempdir blob path).
reqwest          = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
tempfile         = "3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = { workspace = true }
# httpmock fakes the OCI Distribution registry endpoint at the
# HTTP layer for `ocimage verify <registry-ref>` integration tests.
# Same dep choice the publish crate uses; lets us assert the exact
# GET sequence the pull path emits.
httpmock         = "0.7"

[[test]]
name = "registry_pull_test"
path = "tests/registry_pull_test.rs"
