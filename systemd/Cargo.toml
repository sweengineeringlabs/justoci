[package]
name = "swe_justoci_oci_systemd"
version = "0.1.0"
edition = "2021"
description = "oci-systemd — generate systemd `.service` units that boot an `ocimage build` output directory via xkvm (Phase 2f-δ)."
license = "MIT"
repository = "https://github.com/sweengineeringlabs/vmisolate"
authors = ["SWE Engineering Labs"]
rust-version.workspace = true

[package.metadata.struct-engine]
application_type = "lib"

[lib]
name = "oci_systemd"
path = "src/lib.rs"

[dependencies]
thiserror   = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }

[[test]]
name = "generate_unit_int_test"
path = "tests/generate_unit_int_test.rs"
