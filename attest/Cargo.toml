[package]
name = "swe_justoci_attest"
version = "0.1.0"
edition = "2021"
description = "Attestation pipeline for justoci — SLSA provenance + CycloneDX/SPDX SBOM + cosign signing emitted as OCI 1.1 referrers."
license = "Apache-2.0"
repository = "https://github.com/sweengineeringlabs/justoci"
rust-version.workspace = true

[lib]
name = "attest"
path = "src/lib.rs"

[dependencies]
# Internal sibling crates.
spec       = { workspace = true }
cas        = { workspace = true }

# JSON serialization for SLSA + SBOM payloads. CycloneDX 1.5 and SPDX
# 2.3 are hand-rolled JSON: less dep-graph surface than pulling in
# cyclonedx-bom or spdx-rs, and we control the byte layout (matters
# for reproducibility — see `core::slsa::emit_slsa` reproducibility
# guarantee in `tests/slsa_reproducibility_test.rs`).
serde      = { workspace = true }
serde_json = { workspace = true }

thiserror  = { workspace = true }
tracing    = { workspace = true }

[dev-dependencies]
# Tempdir-backed `FsCas` in tests + cosign stub harnesses.
tempfile = "3"
